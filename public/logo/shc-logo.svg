<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 80" fill="none">
  <!-- Network nodes and connections -->
  <circle cx="28" cy="18" r="5" fill="#00AFC6"/>
  <circle cx="60" cy="8" r="4" fill="#0B7FD3"/>
  <circle cx="92" cy="18" r="5" fill="#00AFC6"/>
  <circle cx="76" cy="34" r="3.5" fill="#0B7FD3"/>
  <circle cx="44" cy="34" r="3.5" fill="#0B7FD3"/>

  <!-- Connecting lines -->
  <line x1="28" y1="18" x2="60" y2="8" stroke="#00AFC6" stroke-width="1.5" opacity="0.7"/>
  <line x1="60" y1="8" x2="92" y2="18" stroke="#00AFC6" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="18" x2="44" y2="34" stroke="#0B7FD3" stroke-width="1.2" opacity="0.6"/>
  <line x1="92" y1="18" x2="76" y2="34" stroke="#0B7FD3" stroke-width="1.2" opacity="0.6"/>
  <line x1="44" y1="34" x2="76" y2="34" stroke="#00AFC6" stroke-width="1.2" opacity="0.5"/>
